version: '3.9'

services:
  comm_server:
    image: solidproject/community-server:latest
    container_name: comm_server
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./config:/config
    command: >
      --port 3000
    restart: unless-stopped

  media-kraken:
    image: media-kraken
    container_name: media-kraken
    ports:
      - "8080:80"
    depends_on:
      - comm_server
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  solid-vue-app:
    image: solid-cinema
    container_name: solid-vue-app
    ports:
      - "8081:80"
    depends_on:
      - comm_server
      - media-kraken
    environment:
      - NODE_ENV=development
    restart: unless-stopped

networks:
  default:
    name: solid-network
